<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend mentor challenge</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {



            align-items: center;
            background-color: hsl(0, 0%, 8%);
            justify-content: center;
            display: flex;
            flex-direction: column;

        }

        .container {
            width: 410px;
            height: 600px;
            padding: 2.5rem;
            border: 3px solid transparent;
            border-radius: 10px;
            align-items: center;
            background-color: hsl(0, 0%, 12%);


        }

        .container img {
            width: 88px;
            height: 88px;
            border-radius: 50px;
        }

        h1 {
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
        }

        h3 {
            color: hsl(75, 94%, 57%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
        }

        p {
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
        }

        button {
            width: 300px;
            height: 45px;
            border-radius: 10px;
            border: 3px solid transparent;

            color: white;

            background-color: hsl(0, 0%, 20%);
            font-weight: bold;
            transition: 0.4s ease-in-out;
        }

        button:hover {
            color: black;
            cursor: pointer;
            background-color: hsl(75, 94%, 57%);
        }

        kimg {
            border-radius: 10px;
        }
    </style>

</head>

<body>

    <div class="container">
        <center>
            <img src="avatar-jessica.jpeg" alt="">
            <h1>Jessica Randall</h1>
            <h3>London, United Kingdom</h3><br>
            <p>"Front-end developper and avid reader"</p><br>
            <button>GitHub</button><br><br>
            <button>Frontend Mentor</button><br><br>
            <button>Linkedin</button><br><br>
            <button>Twitter</button><br><br>
            <button>Instagram</button>
    </div>

</body>

</html>
